# OpenSSF Scorecard (Linux Foundation) — public third-party supply-chain score.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '40 5 * * 1'

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.6
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
